org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin 2.3.20's incremental compiler re-registers its own cache files and
# then fails to close them, breaking the build outright:
#   Could not close incremental caches in .../caches-jvm/jvm/kotlin
#   Caused by: Storage for [.../inputs/source-to-output.tab] is already registered
# It surfaces first in a plugin module (:android_file_picker), not our code,
# and reproduces on a clean build directory. Clean builds cost a little more;
# a build that cannot finish costs more. Revisit on the next Kotlin bump.
kotlin.incremental=false
